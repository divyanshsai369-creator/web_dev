<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio</title>

<style>

html{
scroll-behavior:smooth;
}

body{
font-family: Arial, sans-serif;
margin:0;
padding:0;
background:#f4f4f4;
transition:0.3s;
}



header{
background:#333;
color:white;
text-align:center;
padding:20px;
}


nav{
background:#444;
text-align:center;
padding:10px;
}

nav a{
color:white;
margin:0 15px;
text-decoration:none;
font-weight:bold;
}

nav a:hover{
color:yellow;
}



.container{
width:80%;
margin:auto;
padding:20px;
}



section{
background:white;
margin:20px 0;
padding:20px;
border-radius:8px;
}


ul{
list-style:square;
}



footer{
background:#333;
color:white;
text-align:center;
padding:10px;
}


input, textarea{
width:250px;
padding:8px;
margin-top:5px;
}



button{
padding:10px 15px;
background:#333;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:black;
}



.dark{
background:#121212;
color:white;
}

.dark section{
background:#1e1e1e;
}



.theme-toggle{
position:fixed;
top:15px;
right:15px;
font-size:25px;
cursor:pointer;
}



@media (max-width:768px){

.container{
width:90%;
}

input, textarea{
width:100%;
}

}

</style>

</head>

<body>



<div class="theme-toggle" onclick="toggleTheme()" id="icon">
🌙
</div>

<header>
<h1>MY PORTFOLIO</h1>
</header>

<nav>

<a href="#about">About</a>
<a href="#skills">Skills</a>
<a href="#projects">Projects</a>
<a href="#contact">Contact</a>

</nav>

<div class="container">

<section id="about">

<h2>About Me</h2>

<p>
Myself Divyansh Saini.  
I am studying Web Development and pursuing BCA.
</p>

</section>

<section id="skills">

<h2>Skills</h2>

<ul>

<li>Java</li>
<li>MS Office</li>
<li>Basic HTML</li>

</ul>

</section>

<section id="projects">

<h2>Project</h2>

<p>
Student Result and Marksheet Generator System
</p>

</section>

<section id="contact">

<h2>Contact Me</h2>

<form onsubmit="return validateForm()">

<label>Name</label><br>

<input type="text" id="name" placeholder="Enter your name">

<br><br>

<label>Email</label><br>

<input type="email" id="email" placeholder="Enter your email">

<br><br>

<label>Message</label><br>

<textarea id="message" rows="4" placeholder="Enter your message"></textarea>

<br><br>

<button type="submit">Send Message</button>

<p id="error"></p>

</form>

</section>

</div>

<footer>

<p>© 2026 Divyansh Saini</p>

</footer>

<script>



function toggleTheme(){

document.body.classList.toggle("dark")

let icon=document.getElementById("icon")

if(document.body.classList.contains("dark")){

icon.innerHTML="☀"

}

else{

icon.innerHTML="🌙"

}

}



function validateForm(){

let name=document.getElementById("name").value
let email=document.getElementById("email").value
let message=document.getElementById("message").value
let error=document.getElementById("error")

if(name==="" || email==="" || message===""){

error.innerHTML="Please fill all fields"
error.style.color="red"

return false

}

error.innerHTML="Form submitted successfully"
error.style.color="green"

return false

}

</script>

</body>
</html>
